<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Test your knowledge of shark anatomy with our interactive skeleton quiz! Identify different parts of a shark's skeletal structure.">
    <meta name="theme-color" content="#0ea5e9">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.ico">
    <title>SharkQuiz - Test Your Shark Anatomy Knowledge</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Add FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Add Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Add AOS (Animate On Scroll) library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        /* Custom styles for amazing UI */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c4a6e, #0ea5e9, #0c4a6e);
            background-size: 400% 400%;
            background-attachment: fixed;
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }
        
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 8s infinite ease-in;
            pointer-events: none;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .shark-container {
            position: relative;
            width: 100%;
            max-width: 1000px; /* Increased from 800px */
        }
        
        .interactive-point {
            position: absolute;
            width: 30px; /* Increased from 24px */
            height: 30px; /* Increased from 24px */
            background-color: rgba(0, 238, 255, 0.7);
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
            z-index: 10;
        }
        
        /* Make points larger on mobile for easier tapping */
        @media (max-width: 640px) {
            .interactive-point {
                width: 36px;
                height: 36px;
            }
        }
        
        .interactive-point:hover, .interactive-point:active {
            background-color: rgba(255, 105, 180, 0.8);
            transform: translate(-50%, -50%) scale(1.5);
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 238, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 238, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 238, 255, 0); }
        }
        
        .progress-bar {
            height: 10px;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        
        .modal {
            backdrop-filter: blur(8px);
        }
        
        .question-card {
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            width: 90%;
            max-width: 500px;
        }
        
        .question-card:hover {
            transform: translateY(-5px);
        }
        
        .option-btn {
            overflow: hidden;
            position: relative;
        }
        
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .option-btn:hover::before, .option-btn:active::before {
            left: 100%;
        }
        
        #bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .point-label {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            transform: translate(-50%, calc(-100% - 5px));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        
        .interactive-point:hover + .point-label, .interactive-point:active + .point-label {
            opacity: 1;
        }
        
        .completed-point {
            background-color: rgba(153, 153, 153, 0.7);
            animation: none;
        }
        
        .answered-correctly {
            background-color: rgba(72, 187, 120, 0.7);
        }
        
        .attempted-point {
            background-color: rgba(237, 137, 54, 0.7);
        }
        
        .highlight {
            animation: highlightPoint 2s ease infinite !important;
            z-index: 30;
        }
        
        @keyframes highlightPoint {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            50% { transform: translate(-50%, -50%) scale(1.8); box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.5); }
            100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
        }
        
        /* Mobile-specific styles */
        @media (max-width: 640px) {
            .question-card {
                padding: 1rem !important;
                width: 95% !important;
            }
            
            h1 {
                font-size: 2rem !important;
            }
            
            .point-label {
                font-size: 0.7rem;
                padding: 2px 6px;
            }
            
            /* Make all buttons larger for easier tapping */
            button {
                min-height: 44px;
            }
            
            /* Better layout for modal buttons on small screens */
            .modal-buttons {
                flex-direction: column-reverse;
                gap: 0.5rem;
            }
            
            .modal-buttons button {
                width: 100%;
            }
            
            /* Make sure options are large enough to tap */
            .option-btn {
                padding: 0.75rem !important;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Animated bubbles background -->
    <div id="bubble-container"></div>
    
    <!-- Navigation bar -->
    <nav class="w-full py-4 px-6 flex justify-between items-center relative z-10 sticky top-0 bg-blue-900 bg-opacity-30 backdrop-filter backdrop-blur-lg">
        <div class="flex items-center">
            <i class="fas fa-fish text-white text-3xl mr-2 transform rotate-180"></i>
            <span class="text-white text-xl font-bold">SharkQuiz</span>
        </div>
        <div>
            <a href="index.html" class="text-white hover:text-blue-200 transition duration-300 mr-4">
                <i class="fas fa-home mr-1"></i> Home
            </a>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mx-auto px-4 py-8 flex flex-col items-center justify-center">
        <!-- Header with animation -->
        <div class="text-center mb-6" data-aos="fade-down" data-aos-duration="1000">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-2">Shark Skeleton Quiz</h1>
        </div>
        
        <!-- Main quiz card -->
        <div class="glass-card p-4 sm:p-6 w-full max-w-5xl" data-aos="zoom-in" data-aos-duration="1000">
            <!-- Quiz progress -->
            <div class="mb-4 sm:mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-white font-medium">Your Progress</span>
                    <span class="text-white" id="progress-text">0/6</span>
                </div>
                <div class="w-full bg-blue-900 bg-opacity-30 rounded-full h-2.5">
                    <div class="progress-bar h-2.5 rounded-full" id="progress-bar" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- Shark image with interactive points -->
            <div class="shark-container relative rounded-xl overflow-hidden shadow-2xl mx-auto" data-aos="fade-up" data-aos-delay="200">
                <img src="assets/shark-skeleton.jpeg" alt="Shark Skeleton" class="w-full rounded-xl" id="shark-image"/>
                <!-- Interactive points will be added by JavaScript -->
            </div>
            
            <div class="mt-4 text-center text-white text-opacity-80">
                <p><i class="fas fa-info-circle mr-1"></i> Click on the glowing points to answer questions about shark anatomy</p>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="mt-8 sm:mt-12 text-center text-white text-opacity-70 px-4">
            <p>Created with <i class="fas fa-heart text-red-500"></i> for marine biology enthusiasts</p>
        </div>
    </div>
    
    <!-- Question modal (hidden by default) -->
    <div id="quiz-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="question-card bg-blue-100 max-w-md w-full mx-auto rounded-xl p-6 shadow-2xl transform transition-all duration-300" data-aos="zoom-in">
            <!-- Modal header with title -->
            <div class="flex items-center mb-4 pb-2 border-b border-blue-200">
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center mr-3">
                    <i class="fas fa-question text-white text-lg"></i>
                </div>
                <h3 id="modal-title" class="text-xl font-bold text-blue-600 flex-grow"></h3>
                <button id="modal-close" class="text-gray-400 hover:text-gray-600 transition duration-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <h4 id="modal-question" class="text-lg font-bold text-gray-800 mb-4"></h4>
            
            <!-- Options with animated hover effect -->
            <div id="modal-options" class="space-y-3 mb-6">
                <!-- Options will be populated by JavaScript -->
            </div>
            
            <!-- Feedback area with icon -->
            <div id="feedback-container" class="mb-4 hidden">
                <div class="flex items-start p-3 rounded-lg bg-blue-50">
                    <i id="feedback-icon" class="fas fa-info-circle mt-1 mr-2 text-blue-500"></i>
                    <span id="modal-feedback" class="text-blue-600 font-medium flex-grow"></span>
                </div>
            </div>
            
            <!-- Modal footer with buttons -->
            <div class="flex justify-end items-center modal-buttons mt-4 pt-3 border-t border-gray-100">
                <button id="modal-next" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md hover:shadow-lg transform hover:scale-105">
                    <i class="fas fa-arrow-right mr-2"></i>Next Point
                </button>
            </div>
        </div>
    </div>
    
    <!-- Completion modal (hidden by default) -->
    <div id="completion-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white max-w-md mx-auto rounded-xl p-6 sm:p-8 shadow-2xl text-center w-11/12">
            <i class="fas fa-trophy text-yellow-500 text-5xl sm:text-6xl mb-4"></i>
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Congratulations!</h2>
            <p id="completion-message" class="text-gray-600 mb-6">You've completed the quiz with a score of X/Y!</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button id="try-again" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">Try Again</button>
                <a href="index.html" class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-300">Back to Home</a>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS animation library
        AOS.init();
        
        // Create bubbles for background
        document.addEventListener('DOMContentLoaded', function() {
            const bubbleContainer = document.getElementById('bubble-container');
            const bubbleCount = window.innerWidth < 768 ? 10 : 20; // Fewer bubbles on mobile
            
            for (let i = 0; i < bubbleCount; i++) {
                createBubble();
            }
            
            function createBubble() {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                const size = Math.random() * 100 + 50;
                const left = Math.random() * 100;
                const delay = Math.random() * 10;
                const duration = Math.random() * 10 + 10;
                
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${left}%`;
                bubble.style.bottom = `-${size}px`;
                bubble.style.animationDuration = `${duration}s`;
                bubble.style.animationDelay = `${delay}s`;
                
                bubbleContainer.appendChild(bubble);
                
                setTimeout(() => {
                    bubble.remove();
                    createBubble();
                }, (delay + duration) * 1000);
            }
        });
    </script>
    <script src="js/quiz.js"></script>
</body>
</html>
